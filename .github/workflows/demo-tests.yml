name: PAPER AI demo checks

on:
  push:
    paths: ['demo/**', '.github/workflows/demo-tests.yml']
  pull_request:
    paths: ['demo/**', '.github/workflows/demo-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core and API tests
        run: python -m unittest discover -s demo/tests -p 'test_*.py' -v
      - name: Browser module syntax
        run: |
          for file in demo/static/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Install test-only image and browser tools
        run: |
          npm install --no-save playwright @napi-rs/canvas
          npx playwright install --with-deps chromium
      - name: Image-level scanner tests
        run: |
          node demo/tests/scanner_test.cjs
          node demo/tests/release05_test.cjs
          node demo/tests/release06_test.cjs
        env:
          PAPER_TEST_OUTPUT: test-results
      - name: Browser and PDF smoke test
        run: |
          python demo/server.py --data /tmp/paper-ai-ci.sqlite3 > /tmp/paper-ai-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/api/bootstrap > /dev/null; then break; fi
            sleep 1
          done
          node demo/tests/browser_smoke.cjs
        env:
          PAPER_TEST_OUTPUT: test-results
      - name: Product workflows and pagination
        run: |
          node demo/tests/product_browser.cjs
          node demo/tests/pagination_browser.cjs
          node demo/tests/workbook_browser.cjs
          node demo/tests/release05_browser.cjs
          node demo/tests/release06_browser.cjs
        env:
          PAPER_TEST_OUTPUT: test-results/product
      - name: Restore backup into a separate database
        run: |
          python demo/server.py --port 8766 --data /tmp/paper-ai-restore-ci.sqlite3 > /tmp/paper-ai-restore.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8766/api/bootstrap > /dev/null; then break; fi
            sleep 1
          done
          node demo/tests/restore_browser.cjs
        env:
          PAPER_RESTORE_URL: http://127.0.0.1:8766
          PAPER_BACKUP_FILE: test-results/product/synthetic-backup.json
      - name: Preserve synthetic screenshots and print outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-ai-demo-evidence
          path: test-results
          if-no-files-found: ignore
