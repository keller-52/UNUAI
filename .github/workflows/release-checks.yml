name: PAPER AI formal release checks
on:
  push:
    paths: ['app/**', 'mobile/**', 'tools/**', '.github/workflows/release-checks.yml']
  pull_request:
    paths: ['app/**', 'mobile/**', 'tools/**', '.github/workflows/release-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contracts, API, persistence and portable packages
        run: python -m unittest discover -s app/tests -p 'test_*.py' -v
      - name: Check browser module syntax
        run: |
          for file in app/static/*.js; do node --input-type=module --check < "$file"; done
      - name: Browser and image tools
        run: |
          npm install --no-save --package-lock=false playwright @napi-rs/canvas
          npx playwright install --with-deps chromium
      - name: Scanner regression
        run: |
          node app/tests/scanner_test.cjs
          node app/tests/release05_test.cjs
          node app/tests/release06_test.cjs
      - name: Formal product workflow, bilingual layouts and print output
        run: |
          python app/server.py --data /tmp/paper-ai-release.sqlite3 > /tmp/paper-ai-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/api/bootstrap > /dev/null; then break; fi
            sleep 1
          done
          node app/tests/release_browser.cjs
      - name: Preserve screenshots and PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-ai-release-checks
          path: test-results/release
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Keep the installation signing identity across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: paper-ai-installation-key-v1
      - name: Prepare embedded runtime
        run: python tools/prepare_mobile.py android
      - name: Build installable APK
        run: |
          gradle -p mobile/android assembleRelease
          mkdir -p dist/android
          cp mobile/android/app/build/outputs/apk/release/app-release.apk dist/android/PAPER-AI.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run embedded backend and WebView on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/smoke_android.sh
      - name: Android package and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-ai-android
          path: dist/android
          if-no-files-found: error
  ios:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare runtime and Xcode tools
        run: |
          brew install xcodegen
          python -m pip install certifi==2025.8.3
          npm install --no-save --package-lock=false @napi-rs/canvas
          python tools/prepare_mobile.py ios
      - name: Compile simulator app and unsigned device IPA
        run: bash tools/build_ios.sh
      - name: Package Xcode project
        working-directory: mobile/ios
        run: zip -qry ../../dist/ios/PAPER-AI-Xcode.zip . -x 'build/*' 'Python-support.tar.gz'
      - name: Run embedded backend and WebKit on iOS
        run: bash tools/smoke_ios.sh
      - name: iOS packages and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-ai-ios
          path: |
            dist/ios/*.ipa
            dist/ios/*.zip
            dist/ios/*.png
            dist/ios/*.log
          if-no-files-found: error
