plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'io.github.keller52.paperai'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.keller52.paperai'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildTypes {
        // Installable APK. Replace this installation signature with your own
        // release signingConfig before distributing through an app store.
        release { signingConfig signingConfigs.debug; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy { defaultConfig { version '3.13'; pyc { src = false } } }
