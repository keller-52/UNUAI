name: PaperAI
options:
  projectFormat: xcode15_3
  xcodeVersion: '15.4'
  bundleIdPrefix: io.github.keller52
  deploymentTarget:
    iOS: '15.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
    MARKETING_VERSION: '0.6.0'
    CURRENT_PROJECT_VERSION: '6'
targets:
  PaperAI:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: app
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PAPER AI
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Take a photo of your paper learning record.
        NSPhotoLibraryUsageDescription: Import a photo of your paper learning record.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.keller52.paperai
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PythonRuntime.h
        HEADER_SEARCH_PATHS: '$(BUILT_PRODUCTS_DIR)/Python.framework/Headers'
        FRAMEWORK_SEARCH_PATHS: '$(PROJECT_DIR)'
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: Python.xcframework
        embed: true
        codeSign: true
    postBuildScripts:
      - name: Package Python standard library
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          source "$PROJECT_DIR/Python.xcframework/build/utils.sh"
          install_python Python.xcframework app
